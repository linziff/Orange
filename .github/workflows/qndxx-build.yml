name: QNDXX 5.2.1 Multi-platform Build

# Build Android, Windows, and macOS artifacts for the QNDXX branch.
on:
  workflow_dispatch:
  push:
    branches:
      - qndxx/qndxx

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
            artifact_name: QNDXX-Android-5.2.1
          - platform: Windows
            os: windows-2022
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
            artifact_name: QNDXX-Windows-5.2.1
          - platform: macOS
            os: macos-15
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
            artifact_name: QNDXX-macOS-5.2.1

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.platform == 'Windows' && 'Visual Studio 17 2022' || '' }}
    steps:
      - name: Checkout QNDXX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate XBoard SDK code
        shell: bash
        run: |
          cd lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK path
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          NDK_PATH="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_PATH"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Setup Rust
        if: matrix.platform == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve Mihomo core modules
        shell: bash
        run: |
          cd core
          go mod tidy

      - name: Build Android Mihomo core libraries
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          dart setup.dart android --out core

      - name: Build Windows core and helper service
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          mkdir -p libclash/windows
          dart setup.dart windows --arch amd64 --out core
          TOKEN="$(sha256sum libclash/windows/amd64/FlClashCore.exe | awk '{print $1}')"
          TOKEN="$TOKEN" cargo build --release --features windows-service --manifest-path services/helper/Cargo.toml
          cp services/helper/target/release/helper.exe libclash/windows/FlClashHelperService.exe

      - name: Build macOS core
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          mkdir -p libclash/macos
          dart setup.dart macos --arch arm64 --out core

      - name: Build
        shell: bash
        run: ${{ matrix.command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
