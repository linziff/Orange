name: QNDXX 5.2.1 Multi-platform Build

# Build Android plus native-architecture Windows and macOS artifacts.
# Automatic builds are intentionally disabled; use workflow_dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            arch: all
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
            artifact_name: QNDXX-Android-5.2.1

          - platform: Windows
            arch: amd64
            os: windows-2022
            generator: Visual Studio 17 2022
            flutter_arch: x64
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
            artifact_name: QNDXX-Windows-amd64-5.2.1

          - platform: Windows
            arch: arm64
            os: windows-11-arm
            generator: Visual Studio 18 2026
            flutter_arch: arm64
            command: flutter build windows --release
            artifact: build/windows/arm64/runner/Release
            artifact_name: QNDXX-Windows-arm64-5.2.1

          - platform: macOS
            arch: amd64
            os: macos-15-intel
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
            artifact_name: QNDXX-macOS-x64-5.2.1

          - platform: macOS
            arch: arm64
            os: macos-15
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
            artifact_name: QNDXX-macOS-arm64-5.2.1

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.generator || '' }}
    steps:
      - name: Checkout QNDXX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and pinned NDK
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate XBoard SDK code
        shell: bash
        run: |
          cd lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK path
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_PATH="$SDK_ROOT/ndk/28.0.13004108"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Setup Rust
        if: matrix.platform == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve Mihomo core modules
        shell: bash
        run: |
          cd core
          go mod tidy

      - name: Build Android Mihomo core libraries
        if: matrix.platform == 'Android'
        shell: bash
        run: dart setup.dart android --out core

      - name: Build Windows Mihomo core and helper service
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          mkdir -p libclash/windows
          dart setup.dart windows --arch ${{ matrix.arch }} --out core
          CORE_SOURCE="libclash/windows/${{ matrix.arch }}/FlClashCore.exe"
          CORE_TARGET="libclash/windows/FlClashCore.exe"
          test -f "$CORE_SOURCE"
          cp "$CORE_SOURCE" "$CORE_TARGET"
          TOKEN="$(sha256sum "$CORE_SOURCE" | awk '{print $1}')"
          TOKEN="$TOKEN" cargo build --release --features windows-service --manifest-path services/helper/Cargo.toml
          cp services/helper/target/release/helper.exe libclash/windows/FlClashHelperService.exe
          test -f "$CORE_TARGET"
          test -f libclash/windows/FlClashHelperService.exe

      - name: Build macOS Mihomo core
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          mkdir -p libclash/macos
          dart setup.dart macos --arch ${{ matrix.arch }} --out core
          CORE_SOURCE="libclash/macos/${{ matrix.arch }}/FlClashCore"
          CORE_TARGET="libclash/macos/FlClashCore"
          test -f "$CORE_SOURCE"
          cp "$CORE_SOURCE" "$CORE_TARGET"

      - name: Build
        shell: bash
        run: ${{ matrix.command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
