name: QNDXX 5.2.1 Multi-platform Build

# Build Android plus native-architecture Windows and macOS artifacts.
# Automatic builds are intentionally disabled; use workflow_dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            arch: all
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/
            artifact_name: QNDXX-Android-5.2.1

          - platform: Windows
            arch: amd64
            os: windows-2022
            generator: Visual Studio 18 2026
            flutter_arch: x64
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
            artifact_name: QNDXX-Windows-amd64-5.2.1

          - platform: Windows
            arch: arm64
            os: windows-11-arm
            generator: Visual Studio 17 2022
            flutter_arch: arm64
            flutter_version: '3.44.0'
            command: flutter build windows --release
            artifact: build/windows/arm64/runner/Release
            artifact_name: QNDXX-Windows-arm64-5.2.1

          - platform: macOS
            arch: amd64
            os: macos-15-intel
            command: flutter build macos --release
            artifact: QNDXX-macOS-amd64-5.2.1.zip
            artifact_name: QNDXX-macOS-x64-5.2.1

          - platform: macOS
            arch: arm64
            os: macos-15
            command: flutter build macos --release
            artifact: QNDXX-macOS-arm64-5.2.1.zip
            artifact_name: QNDXX-macOS-arm64-5.2.1

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.generator || '' }}
    steps:
      - name: Checkout QNDXX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and pinned NDK
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version || '3.32.8' }}
          channel: stable
          cache: true
          # Flutter 3.44.0 is the first stable release with native Windows ARM64
          # Dart/engine host binaries. Keep the legacy SDK on other build lanes.
          architecture: ${{ matrix.flutter_arch || (matrix.platform == 'macOS' && matrix.arch == 'arm64' && 'arm64') || 'x64' }}

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate XBoard SDK code
        shell: bash
        run: |
          cd lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK path
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_PATH="$SDK_ROOT/ndk/28.0.13004108"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Setup Rust
        if: matrix.platform == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve Mihomo core modules
        shell: bash
        run: |
          cd core
          go mod tidy

      - name: Build Android Mihomo core libraries
        if: matrix.platform == 'Android'
        shell: bash
        run: dart setup.dart android --out core

      - name: Build Windows Mihomo core and helper service
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          mkdir -p libclash/windows
          dart setup.dart windows --arch ${{ matrix.arch }} --out core
          CORE_SOURCE="libclash/windows/${{ matrix.arch }}/FlClashCore.exe"
          CORE_TARGET="libclash/windows/FlClashCore.exe"
          test -f "$CORE_SOURCE"
          cp "$CORE_SOURCE" "$CORE_TARGET"
          TOKEN="$(sha256sum "$CORE_SOURCE" | awk '{print $1}')"
          TOKEN="$TOKEN" cargo build --release --features windows-service --manifest-path services/helper/Cargo.toml
          cp services/helper/target/release/helper.exe libclash/windows/FlClashHelperService.exe
          test -f "$CORE_TARGET"
          test -f libclash/windows/FlClashHelperService.exe

      - name: Build macOS Mihomo core
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          mkdir -p libclash/macos
          dart setup.dart macos --arch ${{ matrix.arch }} --out core
          CORE_SOURCE="libclash/macos/${{ matrix.arch }}/FlClashCore"
          CORE_TARGET="libclash/macos/FlClashCore"
          test -f "$CORE_SOURCE"
          cp "$CORE_SOURCE" "$CORE_TARGET"

      - name: Build
        if: matrix.platform != 'Android'
        shell: bash
        run: ${{ matrix.command }}
 
      - name: Verify Windows executable and native DLL architectures
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $dir = "${{ matrix.artifact }}"
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          function Get-PeMachine([string]$path) {
            $stream = [System.IO.File]::OpenRead($path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE file: $path" }
              return $reader.ReadUInt16()
            } finally { $stream.Dispose() }
          }
          $required = @("QNDXX.exe", "flutter_windows.dll", "FlClashCore.exe", "FlClashHelperService.exe")
          foreach ($name in $required) {
            $path = Join-Path $dir $name
            if (!(Test-Path $path)) { throw "Missing required runtime file: $name" }
            $machine = Get-PeMachine $path
            if ($machine -ne $expected) {
              throw "$name has PE machine 0x$('{0:X4}' -f $machine), expected 0x$('{0:X4}' -f $expected)"
            }
            Write-Host "$name architecture verified: 0x$('{0:X4}' -f $machine)"
          }

      - name: Build and verify Android ABI APKs
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          STAGE="$RUNNER_TEMP/qndxx-abi-apks"
          mkdir -p "$STAGE"
          flutter build apk --release --split-per-abi
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            SRC="$APK_DIR/app-$ABI-release.apk"
            test -s "$SRC"
            cp "$SRC" "$STAGE/QNDXX-Android-$ABI-5.2.1.apk"
            unzip -Z1 "$SRC" | grep -q "^lib/$ABI/"
          done
          flutter build apk --release
          UNIVERSAL="$APK_DIR/app-release.apk"
          test -s "$UNIVERSAL"
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            unzip -Z1 "$UNIVERSAL" | grep -q "^lib/$ABI/"
          done
          cp "$UNIVERSAL" "$STAGE/QNDXX-Android-universal-5.2.1.apk"
          rm -f "$APK_DIR"/*.apk
          cp "$STAGE"/*.apk "$APK_DIR/"
          echo "Verified APK contents:"
          for APK in "$APK_DIR"/QNDXX-Android-*.apk; do
            echo "---- $APK"
            unzip -Z1 "$APK" | grep -E '^lib/(armeabi-v7a|arm64-v8a|x86_64)/' | cut -d/ -f2 | sort -u
          done
          test "$(find "$APK_DIR" -maxdepth 1 -name 'QNDXX-Android-*.apk' | wc -l)" -eq 4

      - name: Add WebView2 Evergreen Bootstrapper
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $dest = "${{ matrix.artifact }}\WebView2RuntimeInstaller.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $dest
          if (!(Test-Path $dest) -or (Get-Item $dest).Length -lt 100000) { throw "WebView2 bootstrapper download failed" }
          @"
          QNDXX requires the Microsoft Edge WebView2 Runtime for embedded Crisp support.
          If Crisp is blank or WebView initialization fails, run WebView2RuntimeInstaller.exe,
          then restart QNDXX. The bootstrapper downloads the runtime matching this device.
          "@ | Set-Content -Path "${{ matrix.artifact }}\WebView2-README.txt" -Encoding UTF8

      - name: Verify macOS app and embedded core architecture
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="build/macos/Build/Products/Release"
          APP="$(find "$RELEASE_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" && test -d "$APP"
          CORE="$(find "$APP" -type f -name FlClashCore -print -quit)"
          test -n "$CORE" && test -x "$CORE"
          EXPECTED="${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}"
          echo "App: $APP"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          RUNNER="$APP/Contents/MacOS/$APP_EXECUTABLE"
          test -x "$RUNNER"
          echo "Runner architectures:"
          lipo -archs "$RUNNER" | tee "$RUNNER.archs"
          grep -qw "$EXPECTED" "$RUNNER.archs"
          echo "Core architectures:"
          lipo -archs "$CORE"
          lipo -archs "$CORE" | grep -qw "$EXPECTED"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "QNDXX-macOS-${{ matrix.arch }}-5.2.1.zip"
          test -s "QNDXX-macOS-${{ matrix.arch }}-5.2.1.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
