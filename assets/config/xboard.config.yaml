# QNDXX XBoard runtime configuration
# Kept compatible with the full XBoard configuration schema.

xboard:
  # Must exactly match the key in the remote JSON: panels.QNDXX
  provider: QNDXX

  # Primary and fallback remote configuration endpoints.
  remote_config:
    sources:
      - name: primary
        url: https://img.toufq.com/speed/blob/main/url/config.json
        priority: 100
      - name: backup
        url: https://toufq.com/speed/blob/main/config.json
        priority: 90
    max_retries: 3
    timeout_seconds: 15
    retry_delay_seconds: 2

  # App information shown by the XBoard login UI.
  app:
    title: QNDXX
    website: qndxx.app

  # Subscription configuration. Keep the original fields; backend secrets
  # must be supplied from the actual XBoard deployment, never guessed.
  subscription:
    prefer_encrypt: false
    decrypt_key: ""

  security:
    obfuscation_prefix: ""
    user_agents:
      api_encrypted: ""
      domain_racing_test: FlClash/1.0 (Domain Racing Test)

  log:
    enabled: true
    level: info
    prefix: "[QNDXX]"
